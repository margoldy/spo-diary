name: library

x-backend: &backend
  build: .
  image: library-backend:local
  env_file:
    - app/.env
  environment:
    DB_HOST: db
    DB_PORT: 5432
    STORAGE_DIR: /srv/covers
  volumes:
    - covers:/srv/covers
  init: true

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-spo_diary_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан в app/.env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  setup:
    <<: *backend
    command: ["python", "data/load.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres:
  covers:
